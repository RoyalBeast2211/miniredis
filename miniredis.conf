# ==============================================================================
# MiniRedis Example Configuration File
# ==============================================================================

# Network binding
bind 127.0.0.1
port 6379

# In-Memory Storage & Eviction
# maxkeys 0 means unlimited keys. Set to a positive number (e.g. 100000) for LRU eviction.
maxkeys 0

# Append-Only File (AOF) Persistence
appendonly-file appendonly.aof

# fsync policy for AOF durability:
#   always   - fsync after every write operation (slowest, zero data loss)
#   everysec - fsync once per second in background (recommended, ~1s data loss window)
#   no       - let the OS kernel manage flushing (fastest, durability depends on OS)
appendfsync everysec

# Point-in-Time Database Snapshot
dbfilename dump.rdb

# Client resource limits
# Maximum concurrent client connections before rejecting new ones
maxclients 10000

# Client idle timeout in seconds (0 = disabled)
timeout 0

# Replication Configuration
# If this instance is a replica of a primary node, uncomment and configure:
# replicaof 127.0.0.1 6379

# In-memory circular replication backlog ring buffer size in bytes (default: 1MB = 1048576)
repl-backlog-size 1048576

# Logging Level: debug, info, warn, error
loglevel info

# Optional Health Check HTTP Port (0 = disabled, e.g. 8080)
# health-port 8080

# Optional pprof profiling HTTP Port (0 = disabled, e.g. 6060)
# pprof-port 6060

# Graceful shutdown timeout in seconds before forcing process termination
shutdown-timeout 5
